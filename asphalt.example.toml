# Copy to asphalt.toml and replace the creator ID before uploading.
# Never put API keys in this file; use ASPHALT_API_KEY.
[creator]
type = "user" # Change to "group" for a group-owned experience.
id = 0 # REQUIRED: your Roblox user or group ID, matching the API key owner.

[codegen]
style = "nested"

[inputs.ui]
path = "cookieclicker-ui/**/*"
output_path = "src/shared/Assets"

[inputs.assets]
path = "assets/**/*"
output_path = "src/shared/Assets"
